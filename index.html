    /* ============ Galaxy canvas ============ */
    function GalaxyBackground() {
      const ref = useRef(null);
      useEffect(() => {
        const canvas = ref.current; if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let raf, w, h, dpr;
        const stars = [], nebulae = [], shooters = [];
        const resize = () => {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = canvas.clientWidth; h = canvas.clientHeight;
          canvas.width = w * dpr; canvas.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        resize();
        const ro = new ResizeObserver(resize); ro.observe(canvas);
        for (let i = 0; i < 140; i++) {
          stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.4 + 0.2,
            baseA: Math.random() * 0.7 + 0.3, twinkle: Math.random() * Math.PI * 2,
            twinkleSpeed: Math.random() * 0.02 + 0.005, depth: Math.random(),
            hue: Math.random() < 0.85 ? "#ffffff" : (Math.random() < 0.5 ? "#a5b4fc" : "#f0abfc") });
        }
        nebulae.push({ x: w * 0.25, y: h * 0.3, r: Math.max(w, h) * 0.55, color1: "rgba(168,85,247,0.18)", color2: "rgba(168,85,247,0)", vx: 0.04, vy: 0.02 });
        nebulae.push({ x: w * 0.75, y: h * 0.65, r: Math.max(w, h) * 0.5, color1: "rgba(217,70,239,0.16)", color2: "rgba(217,70,239,0)", vx: -0.03, vy: -0.015 });
        nebulae.push({ x: w * 0.5, y: h * 0.9, r: Math.max(w, h) * 0.4, color1: "rgba(34,211,238,0.10)", color2: "rgba(34,211,238,0)", vx: 0.02, vy: -0.03 });
        const draw = () => {
          const bg = ctx.createLinearGradient(0, 0, 0, h);
          bg.addColorStop(0, "#05021a"); bg.addColorStop(0.5, "#0d0628"); bg.addColorStop(1, "#170a3a");
          ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
          for (const n of nebulae) {
            n.x += n.vx; n.y += n.vy;
            if (n.x < -n.r) n.x = w + n.r; if (n.x > w + n.r) n.x = -n.r;
            if (n.y < -n.r) n.y = h + n.r; if (n.y > h + n.r) n.y = -n.r;
            const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
            g.addColorStop(0, n.color1); g.addColorStop(1, n.color2);
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
          }
          for (const s of stars) {
            s.twinkle += s.twinkleSpeed;
            const a = s.baseA * (0.6 + Math.sin(s.twinkle) * 0.4);
            ctx.globalAlpha = a; ctx.fillStyle = s.hue;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
            if (s.r > 1) {
              ctx.globalAlpha = a * 0.3;
              ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2); ctx.fill();
            }
          }
          ctx.globalAlpha = 1;
          if (Math.random() < 0.003 && shooters.length < 2) {
            shooters.push({ x: Math.random() * w * 0.6, y: Math.random() * h * 0.4, vx: 6 + Math.random() * 4, vy: 2 + Math.random() * 2, life: 0, max: 60 });
          }
          for (let i = shooters.length - 1; i >= 0; i--) {
            const sh = shooters[i]; sh.life++;
            const tx = sh.x + sh.vx * sh.life; const ty = sh.y + sh.vy * sh.life;
            const grad = ctx.createLinearGradient(tx - sh.vx * 12, ty - sh.vy * 12, tx, ty);
            grad.addColorStop(0, "rgba(255,255,255,0)"); grad.addColorStop(1, "rgba(255,255,255,0.9)");
            ctx.strokeStyle = grad; ctx.lineWidth = 1.4;
            ctx.beginPath(); ctx.moveTo(tx - sh.vx * 12, ty - sh.vy * 12); ctx.lineTo(tx, ty); ctx.stroke();
            if (sh.life > sh.max) shooters.splice(i, 1);
          }
          raf = requestAnimationFrame(draw);
        };
        raf = requestAnimationFrame(draw);
        return () => { cancelAnimationFrame(raf); ro.disconnect(); };
      }, []);
      return <canvas ref={ref} className="absolute inset-0 w-full h-full" />;
    }

          <g fill={`url(#${id}-grad)`}>
            {Array.from({ length: 7 }).map((_, i) => {
              const angle = (i * 360) / 7 - 90;
              const len = i === 3 ? 38 : 30 + Math.abs(3 - i) * 1.8;

                <>
                  {tab === "home" && <MenuScreen items={MENU} onTapItem={onTapItem}
                    onCart={() => signedIn ? setStack([{ kind: "cart" }]) : setAuthStep("signinPrompt")} cartCount={cartCount} />}
                  {tab === "orders" && <OrdersScreen signedIn={signedIn} onSignIn={() => setAuthStep("signinPrompt")} />}
                  {tab === "account" && <AccountScreen signedIn={signedIn} phone={phone}
                    onSignIn={() => setAuthStep("signinPrompt")} onSignOut={signOut} onAdmin={() => setAdminMode(true)} />}
                </>
              )}
              {stack.length === 0 && <TabBar tab={tab} setTab={setTab} />}
            </div>
            {authStep === "signinPrompt" && <SignInRequiredModal onSignIn={() => setAuthStep("phone")} onCancel={() => setAuthStep(null)} />}
            {authStep === "phone" && <PhoneEntryScreen onBack={() => setAuthStep(null)} onSubmit={(p) => { setPhone(p); setAuthStep("verify"); }} />}
            {authStep === "verify" && <VerifyScreen phone={phone} onBack={() => setAuthStep("phone")} onSuccess={() => { setSignedIn(true); setAuthStep(null); }} />}
            {referralPrompt && <ReferralModal item={referralPrompt} onCancel={() => setReferralPrompt(null)} onSubmit={submitReferral} />}
          </Frame>
        </div>
      );

                  <span className="relative z-10">{it.emoji}</span>
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-base text-white truncate">{it.name}</div>
                  <div className="text-[11px] text-white/50 mt-0.5 uppercase tracking-wider">{it.subtitle}</div>

    function Header({ title, left, right }) {

          <div className="w-10">{left}</div>
          <div>{title}</div>

    }

    function TabBar({ tab, setTab }) {
      const Tab = ({ id, icon: Icon, label }) => {
        const active = tab === id;
        return (
          <button onClick={() => setTab(id)} className="flex-1 flex flex-col items-center justify-center py-2 gap-0.5">
            <Icon size={22} color={active ? C.magenta : "rgba(255,255,255,0.5)"} strokeWidth={active ? 2.4 : 2} />

          <Tab id="home" icon={Home} label="Home" />
          <Tab id="orders" icon={Receipt} label="Orders" />

    function SignInRequiredModal({ onSignIn, onCancel }) {
      return (
        <Overlay>
          <div className="px-6 pt-5 pb-4 mx-6 w-full max-w-xs rounded-2xl" style={{ background: C.glassBg, border: `1px solid ${C.glassHi}`, backdropFilter: "blur(20px)" }}>
            <div className="text-lg font-bold text-white">Login Required</div>
            <div className="text-sm text-white/60 mt-1.5">Please sign in to continue.</div>
            <div className="flex justify-end items-center gap-2 mt-5">
              <button onClick={onCancel} className="px-4 py-2 text-white/60 font-medium">Cancel</button>
              <button onClick={onSignIn} className="px-5 py-2.5 rounded-xl font-bold text-white" style={{ background: COSMIC_GRADIENT }}>Sign In</button>
            </div>
          </div>
        </Overlay>

    }
    function Overlay({ children }) {
      return <div className="absolute inset-0 z-40 flex items-center justify-center" style={{ background: "rgba(5,2,26,0.7)", backdropFilter: "blur(8px)" }}>{children}</div>;
    }

    function PhoneEntryScreen({ onBack, onSubmit }) {
      const [val, setVal] = useState("");
      const formatted = formatPhone(val);
      const valid = val.replace(/\D/g, "").length === 10;
      return (
        <div className="absolute inset-0 z-40 flex flex-col">
          <GalaxyBackground />
          <div className="relative z-10 flex flex-col h-full">
            <StatusBar />
            <div className="px-4 pt-2"><button onClick={onBack} className="text-white p-2 -ml-2"><ArrowLeft size={22} /></button></div>
            <div className="flex-1 flex flex-col items-center px-6 pt-4">
              <SLMark size={96} />
              <div className="text-white text-2xl font-black mt-6" style={{ letterSpacing: "0.05em" }}>Welcome</div>
              <div className="text-white/60 text-sm mt-2">Enter your phone number to get started</div>
              <div className="w-full mt-8 flex gap-2" style={{ maxWidth: "100%" }}>
                <div className="flex-shrink-0 px-3 py-3 rounded-xl flex items-center gap-1.5 font-bold text-white" style={{ background: C.glassBg, border: `1px solid ${C.glassBorder}` }}>
                  <span role="img" aria-label="Canada">&#127464;&#127462;</span><span style={{fontSize:"14px"}}>+1</span>
                </div>
                <input inputMode="numeric" placeholder="(416) 555-0100" value={formatted}
                  onChange={(e) => setVal(e.target.value.replace(/\D/g, "").slice(0, 10))}
                  style={{ flex: 1, minWidth: 0, background: C.glassBg, border: `1px solid ${C.glassBorder}`, borderRadius: 12, padding: "12px 16px", outline: "none", color: "white", fontSize: "16px" }} />
              </div>
              <button disabled={!valid} onClick={() => onSubmit(val)}
                className="w-full mt-8 py-4 rounded-xl font-bold text-base text-white disabled:opacity-40"
                style={{ background: COSMIC_GRADIENT }}>Send Verification Code</button>
              <div className="text-white/50 text-xs text-center mt-6 leading-relaxed px-4">
                By continuing, you agree to our{" "}
                <a href={TERMS_URL} target="_blank" rel="noopener noreferrer" className="underline" style={{ color: C.magenta }}>Terms of Service and Privacy Policy</a>
              </div>
            </div>
          </div>
        </div>
      );

    function formatPhone(raw) {
      const d = raw.replace(/\D/g, "").slice(0, 10);
      if (d.length < 4) return d;
      if (d.length < 7) return `(${d.slice(0, 3)}) ${d.slice(3)}`;
      return `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}`;
    }

    function VerifyScreen({ phone, onBack, onSuccess }) {
      const [code, setCode] = useState(["", "", "", "", "", ""]);
      const [error, setError] = useState("");
      const [resendIn, setResendIn] = useState(30);
      useEffect(() => { if (resendIn <= 0) return; const t = setTimeout(() => setResendIn((r) => r - 1), 1000); return () => clearTimeout(t); }, [resendIn]);
      const setDigit = (i, v) => {
        const d = v.replace(/\D/g, "").slice(0, 1);
        const next = [...code]; next[i] = d; setCode(next);
        if (d && i < 5) document.getElementById(`otp-${i + 1}`)?.focus();
      };
      const submit = () => { if (code.join("").length === 6) onSuccess(); else setError("Enter all 6 digits"); };
      const filled = code.every((d) => d);
      return (
        <div className="absolute inset-0 z-40 flex flex-col">
          <GalaxyBackground />
          <div className="relative z-10 flex flex-col h-full">
            <StatusBar />
            <div className="px-4 pt-2"><button onClick={onBack} className="text-white p-2 -ml-2"><ArrowLeft size={22} /></button></div>
            <div className="flex-1 flex flex-col items-center px-6 pt-6">
              <SLMark size={80} />
              <div className="text-white text-2xl font-black mt-6">Enter Code</div>
              <div className="text-white/60 text-sm mt-2 text-center">
                Sent to <span className="text-white font-medium">+1 {formatPhone(phone)}</span>
              </div>
              <div className="flex gap-2 mt-10">
                {code.map((d, i) => (
                  <input key={i} id={`otp-${i}`} inputMode="numeric" maxLength={1} value={d}
                    onChange={(e) => setDigit(i, e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Backspace" && !code[i] && i > 0) document.getElementById(`otp-${i - 1}`)?.focus(); }}
                    className="w-11 h-14 text-center text-2xl font-bold rounded-xl outline-none text-white"
                    style={{ background: C.glassBg, border: error ? `2px solid ${C.magenta}` : `2px solid ${C.glassBorder}` }} />
                ))}
              </div>
              {error && <div className="text-pink-300 text-xs mt-3">{error}</div>}
              <button disabled={!filled} onClick={submit} className="w-full mt-8 py-4 rounded-xl font-bold text-white disabled:opacity-40" style={{ background: COSMIC_GRADIENT }}>Verify</button>
              <button disabled={resendIn > 0} onClick={() => setResendIn(30)} className="text-white/70 text-sm mt-5 disabled:opacity-50">{resendIn > 0 ? `Resend in ${resendIn}s` : "Resend code"}</button>
              <div className="text-white/40 text-[11px] text-center mt-4 px-6">Demo: any 6 digits work. Production uses Twilio Verify SMS.</div>
            </div>
          </div>
        </div>
      );
    }

    function ReferralModal({ item, onCancel, onSubmit }) {
      const [val, setVal] = useState("");
      const [error, setError] = useState(false);
      const submit = () => { if (!onSubmit(val)) { setError(true); setTimeout(() => setError(false), 1500); } };
      return (
        <Overlay>
          <div className="px-6 pt-5 pb-5 mx-6 w-full max-w-xs rounded-2xl" style={{ background: C.glassBg, border: `1px solid ${C.glassHi}`, backdropFilter: "blur(20px)" }}>
            <div className="flex items-center gap-2">
              <Sparkles size={20} color={C.magenta} fill={C.magenta} />
              <div className="text-lg font-bold text-white">Referral Code</div>
            </div>
            <div className="text-sm text-white/60 mt-1.5">Enter your referral code to view {item.name}.</div>
            <input autoFocus value={val} onChange={(e) => setVal(e.target.value.toUpperCase())} placeholder="e.g. COSMIC26"
              className="w-full mt-4 px-4 py-3 rounded-xl outline-none font-mono font-bold tracking-wide text-white placeholder-white/30"
              style={{ background: "rgba(0,0,0,0.4)", border: error ? `2px solid ${C.magenta}` : `2px solid ${C.glassBorder}` }} />
            {error && <div className="text-pink-300 text-xs mt-2">Invalid or expired code</div>}
            <div className="flex justify-end items-center gap-2 mt-5">
              <button onClick={onCancel} className="px-4 py-2 text-white/60 font-medium">Cancel</button>
              <button onClick={submit} className="px-5 py-2.5 rounded-xl font-bold text-white" style={{ background: COSMIC_GRADIENT }}>Continue</button>
            </div>
          </div>
        </Overlay>
      );
    }

    function StackTop({ stack, setStack, cart, setCart, onAdd, placeOrder, orderConfirmed, goHome }) {
      const top = stack[stack.length - 1];
      const pop = () => setStack(stack.slice(0, -1));
      if (top.kind === "item") return <ItemDetail item={top.item} onBack={pop} onAdd={onAdd} />;
      if (top.kind === "cart") return <CartScreen cart={cart} setCart={setCart} onBack={pop} onCheckout={() => setStack([...stack, { kind: "checkout" }])} />;
      if (top.kind === "checkout") return <CheckoutScreen cart={cart} onBack={pop} onPlace={placeOrder} />;
      if (top.kind === "orderConfirmed") return <OrderConfirmedScreen order={orderConfirmed} onDone={goHome} />;
      return null;
    }

    function ItemDetail({ item, onBack, onAdd }) {
      const [size, setSize] = useState(item.sizes[0]);
      const [flavor, setFlavor] = useState(item.flavors ? item.flavors[0] : null);
      const [qty, setQty] = useState(1);
      return (
        <div className="flex-1 flex flex-col">
          <div className="flex items-center px-4 py-3">
            <button onClick={onBack} className="text-white p-1"><ArrowLeft size={22} /></button>
            <div className="text-white font-bold text-base ml-2">{item.name}</div>
          </div>
          <div className="flex-1" style={{ overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
            <div className="h-56 mx-4 rounded-3xl flex items-center justify-center text-8xl relative overflow-hidden"
              style={{ background: `linear-gradient(135deg, ${C.nebula} 0%, ${C.deep} 100%)`, border: `1px solid ${C.glassBorder}` }}>
              <div className="absolute inset-0" style={{ background: "radial-gradient(circle at 50% 30%, rgba(217,70,239,0.4), transparent 70%)" }} />
              <span className="relative z-10">{item.emoji}</span>
            </div>
            <div className="p-5">
              <div className="text-xs uppercase tracking-widest font-bold" style={{ color: C.magenta }}>{item.subtitle}</div>
              <h1 className="text-2xl font-black text-white mt-1">{item.name}</h1>
              <p className="text-white/60 text-sm mt-2 leading-relaxed">{item.description}</p>
              <div className="mt-5">
                <SectionTitle>Size</SectionTitle>
                <div className="space-y-2 mt-2">
                  {item.sizes.map((s) => (
                    <button key={s.id} onClick={() => setSize(s)} className="w-full flex items-center justify-between p-3 rounded-xl"
                      style={{ background: size.id === s.id ? "rgba(217,70,239,0.15)" : C.glassBg, border: `2px solid ${size.id === s.id ? C.magenta : C.glassBorder}` }}>
                      <div className="text-left">
                        <div className="font-bold text-white">{s.name}</div>
                        <div className="text-xs text-white/50">{s.info}</div>
                      </div>
                      <div className="font-bold text-white">${s.price.toFixed(2)}</div>
                    </button>
                  ))}
                </div>
              </div>
              {item.flavors && item.flavors.length > 1 && (
                <div className="mt-5">
                  <SectionTitle>Flavor</SectionTitle>
                  <div className="flex flex-wrap gap-2 mt-2">
                    {item.flavors.map((f) => (
                      <button key={f} onClick={() => setFlavor(f)} className="px-3 py-2 rounded-full text-sm font-semibold"
                        style={{ background: flavor === f ? COSMIC_GRADIENT : C.glassBg, color: "white", border: `1px solid ${flavor === f ? "transparent" : C.glassBorder}` }}>{f}</button>
                    ))}
                  </div>
                </div>
              )}
              <div className="mt-5">
                <SectionTitle>Quantity</SectionTitle>
                <div className="flex items-center gap-4 mt-2">
                  <button onClick={() => setQty(Math.max(1, qty - 1))} className="w-10 h-10 rounded-full flex items-center justify-center" style={{ background: C.glassBg, border: `1px solid ${C.glassBorder}` }}><Minus size={18} color="white" /></button>
                  <div className="text-xl font-bold w-8 text-center text-white">{qty}</div>
                  <button onClick={() => setQty(qty + 1)} className="w-10 h-10 rounded-full flex items-center justify-center" style={{ background: C.glassBg, border: `1px solid ${C.glassBorder}` }}><Plus size={18} color="white" /></button>
                </div>
              </div>
            </div>
          </div>
          <div className="p-4" style={{ borderTop: `1px solid ${C.glassBorder}` }}>
            <button onClick={() => onAdd({ id: `${item.id}-${size.id}-${flavor || ''}-${Date.now()}`, itemId: item.id, name: item.name, size: size.name, flavor, price: size.price, qty, emoji: item.emoji })}
              className="w-full py-4 rounded-xl font-bold text-white flex items-center justify-center gap-3" style={{ background: COSMIC_GRADIENT }}>
              <span>Add to Cart</span><span className="opacity-60">\u00B7</span><span>${(size.price * qty).toFixed(2)}</span>
            </button>
          </div>
        </div>
      );
    }

    function SectionTitle({ children }) { return <div className="text-xs uppercase tracking-widest font-bold text-white/50">{children}</div>; }

    function CartScreen({ cart, setCart, onBack, onCheckout }) {
      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const delivery = subtotal > 0 ? 7.99 : 0;
      const tax = subtotal * 0.13;
      const total = subtotal + delivery + tax;
      const remove = (id) => setCart(cart.filter((i) => i.id !== id));
      const setQty = (id, qty) => setCart(cart.map((i) => i.id === id ? { ...i, qty: Math.max(1, qty) } : i));
      return (
        <div className="flex-1 flex flex-col">
          <div className="flex items-center px-4 py-3">
            <button onClick={onBack} className="text-white p-1"><ArrowLeft size={22} /></button>
            <div className="text-white font-bold text-base ml-2">Your Cart</div>
          </div>
          <div className="flex-1 p-4 space-y-3" style={{ overflowY: "auto", WebkitOverflowScrolling: "touch" }}> (
              <div className="flex flex-col items-center justify-center py-20 text-white/40">
                <ShoppingCart size={48} /><div className="mt-4 font-medium">Your cart is empty</div>
              </div>
            )}
            {cart.map((it) => (
              <div key={it.id} className="flex gap-3 p-3 rounded-xl" style={{ background: C.glassBg, border: `1px solid ${C.glassBorder}` }}>
                <div className="w-16 h-16 rounded-lg flex items-center justify-center text-3xl flex-shrink-0" style={{ background: `linear-gradient(135deg, ${C.nebula}, ${C.deep})` }}>{it.emoji}</div>
                <div className="flex-1">
                  <div className="font-bold text-white">{it.name}</div>
                  <div className="text-xs text-white/50 mt-0.5">{it.size}{it.flavor ? ` \u00B7 ${it.flavor}` : ''}</div>
                  <div className="flex items-center justify-between mt-2">
                    <div className="font-bold text-white">${(it.price * it.qty).toFixed(2)}</div>
                    <div className="flex items-center gap-3">
                      <button onClick={() => setQty(it.id, it.qty - 1)} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background: "rgba(255,255,255,0.1)" }}><Minus size={14} color="white" /></button>
                      <span className="font-bold text-white">{it.qty}</span>
                      <button onClick={() => setQty(it.id, it.qty + 1)} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background: "rgba(255,255,255,0.1)" }}><Plus size={14} color="white" /></button>

                </div>
                <button onClick={() => remove(it.id)} className="text-white/40"><XIcon size={16} /></button>

          {cart.length > 0 && (
            <div className="p-4 space-y-3" style={{ borderTop: `1px solid ${C.glassBorder}` }}>
              <Row label="Subtotal" value={`$${subtotal.toFixed(2)}`} />
              <Row label="Delivery (Mississauga/GTA)" value={`$${delivery.toFixed(2)}`} />
              <Row label="HST (13%)" value={`$${tax.toFixed(2)}`} />
              <div className="pt-3 flex justify-between font-bold text-lg text-white" style={{ borderTop: `1px solid ${C.glassBorder}` }}>
                <span>Total</span><span>${total.toFixed(2)}</span>
              </div>
              <button onClick={onCheckout} className="w-full py-4 rounded-xl font-bold text-white" style={{ background: COSMIC_GRADIENT }}>Checkout</button>
            </div>
          )}
        </div>
      );
    }
    function Row({ label, value }) { return <div className="flex justify-between text-sm"><span className="text-white/50">{label}</span><span className="text-white font-medium">{value}</span></div>; }

    function CheckoutScreen({ cart, onBack, onPlace }) {
      const [address, setAddress] = useState("123 Main St, Mississauga, ON");
      const [paying, setPaying] = useState(false);
      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const total = subtotal + 7.99 + subtotal * 0.13;
      return (
        <div className="flex-1 flex flex-col">
          <div className="flex items-center px-4 py-3">
            <button onClick={onBack} className="text-white p-1"><ArrowLeft size={22} /></button>
            <div className="text-white font-bold text-base ml-2">Checkout</div>
          </div>
          <div className="flex-1 p-5 space-y-5" style={{ overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
            <div>
              <SectionTitle>Delivery Address</SectionTitle>
              <input value={address} onChange={(e) => setAddress(e.target.value)} className="w-full mt-2 px-4 py-3 rounded-xl outline-none text-white" style={{ background: C.glassBg, border: `1px solid ${C.glassBorder}` }} />
              <div className="text-xs text-white/40 mt-1">Available: Mississauga, Brampton, Etobicoke, Oakville</div>
            </div>
            <div>
              <SectionTitle>Payment</SectionTitle>
              <div className="mt-2 p-4 rounded-xl" style={{ background: "rgba(217,70,239,0.1)", border: `2px solid ${C.magenta}` }}>
                <div className="font-bold text-white">\u2022\u2022\u2022\u2022 \u2022\u2022\u2022\u2022 \u2022\u2022\u2022\u2022 4242</div>
                <div className="text-xs text-white/50 mt-0.5">Visa \u00B7 Expires 12/27</div>
              </div>
            </div>
            <div>
              <SectionTitle>Order Summary</SectionTitle>
              <div className="mt-2 space-y-2">
                {cart.map((i) => (
                  <div key={i.id} className="flex justify-between text-sm">
                    <span className="text-white/80">{i.qty}\u00D7 {i.name} ({i.size})</span>
                    <span className="text-white font-medium">${(i.price * i.qty).toFixed(2)}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div className="p-4" style={{ borderTop: `1px solid ${C.glassBorder}` }}>
            <button disabled={paying} onClick={() => { setPaying(true); setTimeout(onPlace, 800); }}
              className="w-full py-4 rounded-xl font-bold text-white disabled:opacity-60" style={{ background: COSMIC_GRADIENT }}>
              {paying ? "Processing..." : `Place Order \u00B7 $${total.toFixed(2)}`}
            </button>
          </div>
        </div>
      );
    }

    function OrderConfirmedScreen({ order, onDone }) {
      return (
        <div className="flex-1 flex flex-col items-center justify-center p-6">
          <div className="w-24 h-24 rounded-full flex items-center justify-center" style={{ background: COSMIC_GRADIENT, boxShadow: "0 0 40px rgba(217,70,239,0.5)" }}>
            <Check size={44} color="white" strokeWidth={3} />
          </div>
          <div className="text-2xl font-black text-white mt-6">Order Placed!</div>
          <div className="text-white/60 text-sm mt-2 text-center">
            Order <span className="font-mono font-bold text-white">{order?.id}</span><br />Estimated delivery: 35\u201350 min
          </div>
          <div className="mt-6 px-5 py-3 rounded-xl text-center" style={{ background: C.glassBg, border: `1px solid ${C.glassBorder}` }}>
            <div className="text-xs text-white/50">Total paid</div>
            <div className="text-2xl font-black text-white">${(order?.total + 7.99 + order?.total * 0.13).toFixed(2)}</div>
          </div>
          <button onClick={onDone} className="w-full mt-8 py-4 rounded-xl font-bold text-white" style={{ background: COSMIC_GRADIENT }}>Back to Menu</button>
        </div>
      );
    }

    function OrdersScreen({ signedIn, onSignIn }) {
      if (!signedIn) {
        return (
          <div className="flex-1 flex flex-col">
            <Header title={<SLWordmarkTitle />} />
            <div className="flex-1 flex flex-col items-center justify-center p-8 text-center">
              <Receipt size={48} color="rgba(255,255,255,0.6)" />
              <div className="text-white text-lg font-bold mt-4">No orders yet</div>
              <div className="text-white/60 text-sm mt-2">Sign in to view your order history</div>
              <button onClick={onSignIn} className="mt-6 px-6 py-3 rounded-xl font-bold text-white" style={{ background: COSMIC_GRADIENT }}>Sign In</button>
            </div>
          </div>
        );
      }
      return (
        <div className="flex-1 flex flex-col">
          <Header title={<SLWordmarkTitle />} />
          <div className="flex-1 p-4 space-y-3" style={{ overflowY: "auto", WebkitOverflowScrolling: "touch" }}>((o) => (
              <div key={o.id} className="rounded-2xl p-4" style={{ background: C.glassBg, border: `1px solid ${C.glassBorder}`, backdropFilter: "blur(12px)" }}>
                <div className="flex justify-between items-start">
                  <div>
                    <div className="font-bold text-white">{o.id}</div>
                    <div className="text-xs text-white/50 mt-0.5">{o.date}</div>
                  </div>
                  <div className="px-2.5 py-1 rounded-full text-[11px] font-bold" style={{ background: "rgba(34,211,238,0.2)", color: C.cyan }}>{o.status}</div>
                </div>
                <div className="mt-3 space-y-1">
                  {o.items.map((it, idx) => <div key={idx} className="text-sm text-white/70">{it.name}</div>)}
                </div>
                <div className="mt-3 pt-3 flex justify-between" style={{ borderTop: `1px solid ${C.glassBorder}` }}>
                  <span className="text-sm text-white/50">Total</span>
                  <span className="font-bold text-white">${o.total.toFixed(2)}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function AccountScreen({ signedIn, phone, onSignIn, onSignOut, onAdmin }) {
      if (!signedIn) {
        return (
          <div className="flex-1 flex flex-col">
            <Header title={<SLWordmarkTitle />} />
            <div className="flex-1 flex flex-col items-center justify-center p-8 text-center">
              <SLMark size={80} />
              <div className="text-white text-lg font-bold mt-6">Not signed in</div>
              <button onClick={onSignIn} className="mt-6 px-6 py-3 rounded-xl font-bold text-white" style={{ background: COSMIC_GRADIENT }}>Sign In</button>
            </div>
          </div>
        );
      }
      return (
        <div className="flex-1 flex flex-col">
          <Header title={<SLWordmarkTitle />} />
          <div className="flex-1 p-4 space-y-4" style={{ overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
            <div className="rounded-2xl p-5 flex items-center gap-4" style={{ background: C.glassBg, border: `1px solid ${C.glassBorder}`, backdropFilter: "blur(12px)" }}>
              <div className="w-14 h-14 rounded-full flex items-center justify-center" style={{ background: COSMIC_GRADIENT }}>
                <User size={26} color="white" />
              </div>
              <div>
                <div className="font-bold text-white">Welcome back</div>
                <div className="text-sm text-white/60">+1 {formatPhone(phone)}</div>
              </div>
            </div>
            <div className="rounded-2xl overflow-hidden" style={{ background: C.glassBg, border: `1px solid ${C.glassBorder}`, backdropFilter: "blur(12px)" }}>
              <Row2 icon={Phone} label="Phone Number" value={`+1 ${formatPhone(phone)}`} />
              <Divider />
              <Row2 icon={FileText} label="Terms & Privacy" href={TERMS_URL} />
              <Divider />
              <Row2 icon={Settings} label="Admin Console" onClick={onAdmin} accent />
              <Divider />
              <Row2 icon={LogOut} label="Sign Out" onClick={onSignOut} danger />
            </div>
            <div className="text-center text-white/40 text-xs pt-2">SL \u00B7 v1.0.0 \u00B7 Mississauga, ON</div>
          </div>
        </div>
      );
    }
    function Row2({ icon: Icon, label, value, onClick, href, danger, accent }) {
      const T = href ? "a" : "button";
      return (
        <T href={href} target={href ? "_blank" : undefined} rel={href ? "noopener noreferrer" : undefined} onClick={onClick} className="w-full flex items-center px-4 py-3.5 text-left">
          <Icon size={20} color={danger ? "#f87171" : accent ? C.magenta : "white"} />
          <span className="ml-3 font-medium flex-1" style={{ color: danger ? "#f87171" : "white" }}>{label}</span>
          {value && <span className="text-sm text-white/50 mr-2">{value}</span>}
          {!danger && <ChevronRight size={18} color="rgba(255,255,255,0.4)" />}
        </T>
      );
    }
    function Divider() { return <div className="h-px mx-4" style={{ background: C.glassBorder }} />; }

    function AdminConsole({ onExit, referralCode, setReferralCode, rotationPeriod, setRotationPeriod, lastRotated, codeHistory, rotateNow }) {
      const [edit, setEdit] = useState(false);
      const [draft, setDraft] = useState(referralCode);
      const [reveal, setReveal] = useState(true);
      const [copied, setCopied] = useState(false);
      const nextRotation = useMemo(() => {
        if (rotationPeriod === "manual") return null;
        const days = rotationPeriod === "daily" ? 1 : 7;
        return new Date(new Date(lastRotated).getTime() + days * 86400000);
      }, [rotationPeriod, lastRotated]);
      const copy = () => { navigator.clipboard?.writeText(referralCode); setCopied(true); setTimeout(() => setCopied(false), 1500); };

      return (
        <div className="min-h-screen w-full relative" style={{ background: "#000" }}>
          <div className="fixed inset-0"><GalaxyBackground /></div>
          <div className="relative z-10 max-w-3xl mx-auto p-6">
            <div className="flex items-center justify-between mb-6">
              <div className="flex items-center gap-3">
                <SLMark size={44} />
                <div>
                  <div className="text-3xl font-black" style={{ letterSpacing: "0.2em", background: COSMIC_GRADIENT, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>SL</div>
                  <div className="text-xs text-white/60">Admin \u00B7 Referral codes</div>
                </div>
              </div>
              <button onClick={onExit} className="px-4 py-2 rounded-lg font-medium text-sm text-white" style={{ background: C.glassBg, border: `1px solid ${C.glassBorder}`, backdropFilter: "blur(12px)" }}>\u2190 Back to App</button>
            </div>
            <Card>
              <div className="flex items-start justify-between flex-wrap gap-4">
                <div>
                  <SubLabel>Current Referral Code</SubLabel>
                  <div className="flex items-center gap-3 mt-2">
                    {edit ? (
                      <input autoFocus value={draft} onChange={(e) => setDraft(e.target.value.toUpperCase().replace(/\s/g, ""))}
                        className="text-3xl font-bold font-mono tracking-wider px-3 py-1 rounded-lg outline-none text-white"
                        style={{ background: "rgba(0,0,0,0.4)", border: `2px solid ${C.magenta}` }} />
                    ) : (
                      <div className="text-3xl font-black font-mono tracking-wider" style={{ background: COSMIC_GRADIENT, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>
                        {reveal ? referralCode : "\u2022".repeat(referralCode.length)}
                      </div>
                    )}
                    {!edit && (
                      <>
                        <button onClick={() => setReveal(!reveal)} className="p-2 rounded-lg" style={{ background: "rgba(255,255,255,0.05)" }}>
                          {reveal ? <EyeOff size={18} color="white" /> : <Eye size={18} color="white" />}
                        </button>
                        <button onClick={copy} className="p-2 rounded-lg relative" style={{ background: "rgba(255,255,255,0.05)" }}>
                          <Copy size={18} color="white" />
                          {copied && <span className="absolute -top-7 left-1/2 -translate-x-1/2 text-xs bg-black text-white px-2 py-0.5 rounded">Copied</span>}
                        </button>
                      </>
                    )}
                  </div>
                </div>
                <div className="flex gap-2">
                  {edit ? (
                    <>
                      <button onClick={() => { setDraft(referralCode); setEdit(false); }} className="px-3 py-1.5 rounded-lg text-sm font-medium text-white/60">Cancel</button>
                      <button onClick={() => { if (draft.length >= 4) { setReferralCode(draft); setEdit(false); } }} className="px-3 py-1.5 rounded-lg text-sm font-bold text-white" style={{ background: COSMIC_GRADIENT }}>Save</button>
                    </>
                  ) : (
                    <button onClick={() => { setDraft(referralCode); setEdit(true); }} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-white" style={{ background: "rgba(255,255,255,0.08)" }}>
                      <Edit2 size={14} /> Edit
                    </button>
                  )}
                </div>
              </div>
              <div className="mt-4 flex items-center gap-2 text-xs text-white/50">
                <Clock size={14} /> Last changed: {timeAgo(lastRotated)}
              </div>
            </Card>
            <Card>
              <SubLabel>Rotation Schedule</SubLabel>
              <div className="grid grid-cols-3 gap-2 mt-3">
                {[{ id: "daily", label: "Daily", desc: "Every 24h" }, { id: "weekly", label: "Weekly", desc: "Every 7 days" }, { id: "manual", label: "Manual", desc: "You decide" }].map((opt) => (
                  <button key={opt.id} onClick={() => setRotationPeriod(opt.id)} className="p-3 rounded-xl text-left transition"
                    style={{ border: `2px solid ${rotationPeriod === opt.id ? C.magenta : C.glassBorder}`, background: rotationPeriod === opt.id ? "rgba(217,70,239,0.15)" : "rgba(255,255,255,0.03)" }}>
                    <div className="font-bold text-white">{opt.label}</div>
                    <div className="text-xs text-white/50 mt-0.5">{opt.desc}</div>
                  </button>
                ))}
              </div>
              <div className="mt-4 flex items-center justify-between p-3 rounded-lg" style={{ background: "rgba(255,255,255,0.04)" }}>
                <div className="text-sm">
                  <div className="text-white/50 text-xs">Next rotation</div>
                  <div className="font-bold mt-0.5 text-white">
                    {nextRotation ? nextRotation.toLocaleString("en-CA", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "Manual only"}
                  </div>
                </div>
                <button onClick={rotateNow} className="flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-sm text-white" style={{ background: COSMIC_GRADIENT }}>
                  <RefreshCw size={14} /> Rotate now
                </button>
              </div>
            </Card>
            <Card>
              <SubLabel>Code History</SubLabel>
              <div className="mt-3">
                {codeHistory.slice(0, 6).map((h, i) => (
                  <div key={i} className="flex items-center justify-between py-3" style={{ borderTop: i > 0 ? `1px solid ${C.glassBorder}` : "none" }}>
                    <div className="flex items-center gap-3">
                      <div className="font-mono font-bold" style={{ color: i === 0 ? "white" : "rgba(255,255,255,0.4)" }}>{h.code}</div>
                      {i === 0 && <span className="text-[10px] font-bold px-2 py-0.5 rounded-full text-white" style={{ background: COSMIC_GRADIENT }}>ACTIVE</span>}
                    </div>
                    <div className="text-xs text-white/50">{timeAgo(h.startedAt)}</div>
                  </div>
                ))}
              </div>
            </Card>
            <div className="text-center text-xs text-white/40 mt-6 pb-6">Demo console. Production syncs to backend so customer apps fetch the live code.</div>
          </div>
        </div>
      );
    }
    function Card({ children }) {
      return <div className="rounded-2xl p-5 mb-4" style={{ background: C.glassBg, border: `1px solid ${C.glassBorder}`, backdropFilter: "blur(20px)" }}>{children}</div>;
    }
    function SubLabel({ children }) { return <div className="text-xs uppercase tracking-widest font-bold text-white/50">{children}</div>; }
    function timeAgo(d) {
      const s = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
      if (s < 60) return `${s}s ago`;
      const m = Math.floor(s / 60); if (m < 60) return `${m}m ago`;
      const h = Math.floor(m / 60); if (h < 24) return `${h}h ago`;
      return `${Math.floor(h / 24)}d ago`;
    }
    function generateCode() {
      const w = ["COSMIC", "GALAXY", "STAR", "NEBULA", "ORBIT", "VOID", "ASTRAL", "LUNAR"];
      return `${w[Math.floor(Math.random() * w.length)]}${Math.floor(10 + Math.random() * 90)}`;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
